<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lumen Run</title>
<meta name="description" content="A tiny maze game. Carry the light, collect shards, outrun the shadows.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307080f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fffbe8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header id="hud" hidden>
    <div class="cell"><span class="lab" data-t="level"></span><b id="hLevel">1</b></div>
    <div class="cell"><span class="lab" data-t="shards"></span><b id="hShards">0/0</b></div>
    <div class="cell"><span class="lab" data-t="lives"></span><b id="hLives"></b></div>
    <div class="cell"><span class="lab" data-t="score"></span><b id="hScore">0</b></div>
    <div class="cell dashcell"><span class="lab" data-t="dash"></span><i id="hDash"><u></u></i></div>
  </header>
  <div id="stage">
    <canvas id="cv" aria-label="Lumen Run"></canvas>
    <div id="banner" hidden></div>
    <section id="title" class="panel">
      <h1 data-t="title"></h1>
      <p class="tag" data-t="tagline"></p>
      <div class="row">
        <button id="bPlay" class="primary" data-t="play"></button>
        <button id="bDaily" data-t="daily"></button>
      </div>
      <details>
        <summary data-t="how"></summary>
        <ul id="howList"></ul>
      </details>
      <p class="best"><span data-t="best"></span>: <b id="tBest">0</b></p>
    </section>
    <section id="pause" class="panel" hidden>
      <h2 data-t="paused"></h2>
      <button id="bResume" class="primary" data-t="resume"></button>
    </section>
    <section id="clear" class="panel" hidden>
      <h2 data-t="cleared"></h2>
      <p id="cInfo"></p>
      <button id="bNext" class="primary" data-t="next"></button>
    </section>
    <section id="over" class="panel" hidden>
      <h2 data-t="over"></h2>
      <p id="oInfo"></p>
      <button id="bAgain" class="primary" data-t="again"></button>
    </section>
    <button id="bDash" class="touch" hidden aria-label="Dash">⚡</button>
  </div>
  <footer id="foot">
    <span id="keys"></span>
    <span class="grow"></span>
    <button id="bSpeed" class="link"></button>
    <button id="bSound" class="link"></button>
    <button id="bLang" class="link"></button>
  </footer>
</main>
<script src="src/core.js"></script>
<script src="src/i18n.js"></script>
<script src="src/main.js"></script>
</body>
</html>
